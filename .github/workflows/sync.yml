name: sync quotes

on:
  workflow_dispatch:
  schedule:
    # 매주 일요일 09:00 KST (cron은 UTC 기준)
    - cron: '0 0 * * 0'

permissions:
  contents: write

jobs:
  sync:
    runs-on: [self-hosted, cmms]
    concurrency:
      group: push-main
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: 24
    - name: Run script
      id: sync
      env:
        ROAM_TOKEN: ${{ secrets.ROAM_TOKEN }}
        ROAM_GRAPH: ${{ secrets.ROAM_GRAPH }}
        # SQLite는 쓰기마다 파일 헤더가 바뀌므로 파일이 아니라 quotes 테이블 내용을 비교한다.
        DIGEST: |-
          const { DatabaseSync } = require("node:sqlite");
          const rows = new DatabaseSync("quotes.db", { readOnly: true }).prepare("SELECT * FROM quotes ORDER BY uid").all();
          console.log(require("node:crypto").createHash("sha256").update(JSON.stringify(rows)).digest("hex"));
      run: |-
        before=$(node -e "$DIGEST")
        node sync-quotes.mjs
        after=$(node -e "$DIGEST")
        if [ "$before" = "$after" ]; then
          echo "quotes unchanged"
          git checkout -- quotes.db
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Commit and push
      if: steps.sync.outputs.changed == 'true'
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add quotes.db
        git commit -m "Sync quotes: $(date -u)"
        git pull --rebase origin "${GITHUB_REF_NAME}"
        git push origin "HEAD:${GITHUB_REF_NAME}"
