name: sync quotes

on:
  workflow_dispatch:
  schedule:
    # 매주 일요일 09:00 KST (cron은 UTC 기준)
    - cron: '0 0 * * 0'

permissions:
  contents: write

jobs:
  sync:
    runs-on: [self-hosted, cmms]
    # 푸시하는 job만 그룹을 잡는다. cmba-15가 꺼져 pull이 대기해도 README 워크플로를 막지 않는다.
    concurrency:
      group: push-main
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: 24
    - name: Run script
      id: sync
      env:
        ROAM_TOKEN: ${{ secrets.ROAM_TOKEN }}
        ROAM_GRAPH: ${{ secrets.ROAM_GRAPH }}
        # SQLite는 쓰기마다 파일 헤더가 바뀌므로 파일이 아니라 quotes 테이블 내용을 비교한다.
        DIGEST: |-
          const { DatabaseSync } = require("node:sqlite");
          const rows = new DatabaseSync("quotes.db", { readOnly: true }).prepare("SELECT * FROM quotes ORDER BY uid").all();
          console.log(require("node:crypto").createHash("sha256").update(JSON.stringify(rows)).digest("hex"));
      run: |-
        before=$(node -e "$DIGEST")
        node sync-quotes.mjs
        after=$(node -e "$DIGEST")
        if [ "$before" = "$after" ]; then
          echo "quotes unchanged"
          git checkout -- quotes.db
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Commit and push
      if: steps.sync.outputs.changed == 'true'
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add quotes.db
        git commit -m "Sync quotes: $(date -u)"
        git pull --rebase origin "${GITHUB_REF_NAME}"
        git push origin "HEAD:${GITHUB_REF_NAME}"

  # Raycast quote 확장기능이 읽는 cmba-15의 로컬 클론에 새 quotes.db를 받는다.
  # 지난번에 놓친 pull도 따라잡도록 변경 여부와 관계없이 매번 실행한다.
  # cmba-15가 꺼져 있으면 최대 24시간 대기하다 실패한다.
  pull:
    needs: sync
    runs-on: [self-hosted, cmba-15]
    steps:
    - name: Pull local clone
      env:
        QUOTES_DIR: ${{ vars.QUOTES_DIR }}
      # fast-forward가 안 되면(로컬 변경과 충돌, 로컬 커밋, 다른 브랜치) 원격 내용으로 덮어쓴다.
      # 덮어쓰기 전에 로컬 상태를 .context/sync-conflicts/<시각>/ 으로 옮긴다.
      #   files/          커밋 안 된 변경 파일(복사)과 untracked 파일(이동)
      #   commits.bundle  원격에 없는 로컬 커밋 (git fetch <bundle> main:<브랜치>로 복구)
      # .context에는 러너(actions-runner)가 있으므로 절대 건드리지 않는다.
      run: |-
        dir="${QUOTES_DIR:-$HOME/git/quotes}"
        branch="${GITHUB_REF_NAME}"
        cd "$dir"
        git fetch origin "$branch"
        if [ "$(git branch --show-current)" = "$branch" ] && git merge --ff-only "origin/$branch"; then
          :
        else
          save=".context/sync-conflicts/$(date +%Y%m%d-%H%M%S)"
          mkdir -p "$save"
          git diff -z --name-only --diff-filter=d HEAD -- ':!.context' |
            while IFS= read -r -d '' f; do mkdir -p "$save/files/$(dirname "$f")"; cp -p "$f" "$save/files/$f"; done
          git ls-files -z --others --exclude-standard -- ':!.context' |
            while IFS= read -r -d '' f; do mkdir -p "$save/files/$(dirname "$f")"; mv "$f" "$save/files/$f"; done
          if git rev-parse -q --verify "refs/heads/$branch" >/dev/null &&
             ! git merge-base --is-ancestor "refs/heads/$branch" "origin/$branch"; then
            git bundle create "$save/commits.bundle" "refs/heads/$branch" "^origin/$branch"
          fi
          git checkout -f -B "$branch" "origin/$branch"
          if rmdir "$save" 2>/dev/null; then
            echo "::warning::fast-forward 실패, origin/$branch 내용으로 덮어썼습니다 (옮길 로컬 변경 없음)"
          else
            echo "::warning::fast-forward 실패, origin/$branch 내용으로 덮어썼습니다. 로컬 변경은 $dir/$save 에 있습니다"
          fi
        fi
        git log -1 --oneline
